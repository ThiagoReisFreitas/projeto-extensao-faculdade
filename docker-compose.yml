# Segredos vem SO do .env (${VAR:?...} = compose recusa subir sem eles).
# Gere o .env com `./ops/gen-env.sh` ou copie de .env.example.
services:
  db:
    image: postgres:16-alpine
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pensador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-pensador}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pensador} -d ${POSTGRES_DB:-pensador}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      ADMIN_NOME: ${ADMIN_NOME:-Dono}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dono@opensador.local}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env (>= 8 chars)}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2097152}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PORT: 3000
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    security_opt: [no-new-privileges:true]
    depends_on:
      - api
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    security_opt: [no-new-privileges:true]
    ports:
      # so localhost: sem TLS, nao expor na LAN. Ver proxy/nginx.tls.conf.example p/ VPS.
      - "127.0.0.1:8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
